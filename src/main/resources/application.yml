server:
  port: 8080
  servlet:
    context-path:

spring:
  application:
    name: ctts
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ctts?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
global-config:
  db-config:
    id-type: auto

logging:
  level:
    com.ctts: DEBUG

knife4j:
  enable: true
  setting:
    language: zh_cn